<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Products - Buyer View</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap & Font Awesome -->
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.0/css/all.min.css" rel="stylesheet">

    <style>
        body { font-family: 'Arial', sans-serif; background-color: #f8f9fa; }
        .product-card { transition: transform 0.3s; margin-bottom: 20px; border-radius: 8px; }
        .product-card:hover { transform: scale(1.03); }
        .product-img { height: 250px; object-fit: cover; border-top-left-radius: 8px; border-top-right-radius: 8px; }
        .product-title { font-size: 1rem; font-weight: 600; margin: 10px 0 5px; }
        .product-price { font-size: 1.2rem; font-weight: 700; color: #28a745; }
        .ratting i { color: gold; }
        .sidebar { background: #fff; padding: 20px; border-radius: 5px; margin-top: 20px; }
        .category-list li { margin-bottom: 10px; }
        .modal-body { display: flex; flex-wrap: wrap; gap: 20px; justify-content: center; align-items: flex-start; }
        .modal-images { flex: 1 1 45%; display: flex; flex-direction: column; gap: 10px; }
        .modal-images img { width: 100%; height: auto; border-radius: 5px; }
        .modal-details { flex: 1 1 45%; }
        .modal-details h4 { margin-bottom: 10px; font-weight: 700; }
        .modal-details p { margin-bottom: 8px; }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <a class="navbar-brand" href="#">E Store</a>
    <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
    </button>
</nav>

<div class="container my-4">
    <nav aria-label="breadcrumb">
        <ol class="breadcrumb bg-white p-2">
            <li class="breadcrumb-item"><a href="index.html">Home</a></li>
            <li class="breadcrumb-item active" aria-current="page">Products</li>
        </ol>
    </nav>

    <!-- Search Bar -->
    <div class="input-group mb-3">
        <input type="text" class="form-control" id="searchInput" placeholder="Search products...">
        <div class="input-group-append">
            <button class="btn btn-primary" type="button" onclick="searchProducts()">Search</button>
            <button class="btn btn-secondary" type="button" onclick="resetSearch()">Reset</button>
        </div>
    </div>
</div>

<div class="container">
    <div class="row">
        <div class="col-lg-8">
            <div class="row" id="products-container"></div>
        </div>
        <div class="col-lg-4">
            <div class="sidebar">
                <!-- You can add categories or filters here later -->
            </div>
        </div>
    </div>
</div>

<!-- Product Details Modal -->
<div class="modal fade" id="viewModal" tabindex="-1" role="dialog" aria-labelledby="viewModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-lg modal-dialog-centered" role="document">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="viewModalLabel">Product Details</h5>
        <button type="button" class="close" data-dismiss="modal" aria-label="Close"><span>&times;</span></button>
      </div>
      <div class="modal-body"></div>
    </div>
  </div>
</div>

<footer class="bg-dark text-light mt-5 py-3 text-center">&copy; 2025 E Store. Designed by You.</footer>

<script src="https://code.jquery.com/jquery-3.4.1.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/js/bootstrap.bundle.min.js"></script>

<script>
document.addEventListener("DOMContentLoaded", function() {
    loadAllProducts();
});

function loadAllProducts() {
    fetch("getSellerProduct_1")
        .then(res => res.json())
        .then(data => {
            if (data.success) renderProducts(data.products);
        })
        .catch(err => console.error(err));
}

function searchProducts() {
    const term = document.getElementById("searchInput").value.trim();
    if (term === "") {
        loadAllProducts();
        return;
    }
    fetch("SearchProduct?term=" + encodeURIComponent(term))
        .then(res => res.json())
        .then(data => {
            if (data.success) renderProducts(data.products);
            else alert("Error searching products");
        })
        .catch(err => console.error(err));
}

function resetSearch() {
    document.getElementById("searchInput").value = "";
    loadAllProducts();
}

function renderProducts(products) {
    const container = document.getElementById("products-container");
    container.innerHTML = "";
    if (!products || products.length === 0) {
        container.innerHTML = `<div class="col-12"><p class="text-center text-danger">No products found.</p></div>`;
        return;
    }
    products.forEach(p => {
        const col = document.createElement("div");
        col.className = "col-md-6 col-lg-4";
        col.innerHTML = `
            <div class="card product-card shadow-sm">
                <img src="assets/store/${p.image1}" class="card-img-top product-img" alt="${p.name}">
                <div class="card-body text-center">
                    <h5 class="product-title">${p.name}</h5>
                    <div class="ratting mb-2">
                        <i class="fa fa-star"></i><i class="fa fa-star"></i><i class="fa fa-star"></i>
                        <i class="fa fa-star"></i><i class="fa fa-star"></i>
                    </div>
                    <p class="product-price">$${p.price}</p>
                    <div>
                        <button class="btn btn-success btn-sm" onclick="addToCart(${p.id})">
                            <i class="fa fa-shopping-cart"></i> Add to Cart
                        </button>
                        <button class="btn btn-info btn-sm" onclick='viewProductImages("${p.image1}", "${p.image2}", ${p.qty}, "${p.description.replace(/"/g, "&quot;")}", "${p.name.replace(/"/g, "&quot;")}", ${p.price})'>
                            <i class="fa fa-eye"></i> View
                        </button>
                    </div>
                </div>
            </div>
        `;
        container.appendChild(col);
    });
}

function addToCart(productId) {
    fetch('AddToCart', {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: 'productId=' + productId
    })
    .then(res => res.json())
    .then(data => {
        if (data.success) alert(data.message);
        else if (data.redirect) window.location.href = data.redirect;
        else alert(data.message);
    })
    .catch(err => console.error(err));
}

function viewProductImages(img1, img2, qty, description, name, price) {
    const modalBody = document.querySelector("#viewModal .modal-body");
    modalBody.innerHTML = "";

    const imagesDiv = document.createElement("div");
    imagesDiv.className = "modal-images";
    [img1, img2].forEach(img => {
        if (img) {
            const imgEl = document.createElement("img");
            imgEl.src = "assets/store/" + img;
            imagesDiv.appendChild(imgEl);
        }
    });

    const detailsDiv = document.createElement("div");
    detailsDiv.className = "modal-details";
    detailsDiv.innerHTML = `
        <h4>${name}</h4>
        <p><strong>Price:</strong> $${price}</p>
        <p><strong>Qty:</strong> ${qty}</p>
        <p><strong>Description:</strong> ${description}</p>
    `;

    modalBody.appendChild(imagesDiv);
    modalBody.appendChild(detailsDiv);

    $('#viewModal').modal('show');
}
</script>
</body>
</html>
