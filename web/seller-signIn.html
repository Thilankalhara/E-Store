<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Seller Sign In</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(135deg, #4facfe, #00f2fe);
      background-attachment: fixed;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 2rem;
      font-family: 'Segoe UI', sans-serif;
    }
    .glass-card {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(20px);
      border-radius: 20px;
      padding: 2rem;
      width: 100%;
      max-width: 500px;
      box-shadow: 0 8px 32px rgba(31, 38, 135, 0.37);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.18);
    }
    .form-label, .form-control::placeholder, .form-title, .btn {
      color: #fff;
    }
    .form-control {
      background-color: rgba(255, 255, 255, 0.15);
      border: none;
    }
  </style>
</head>
<body>

<div class="glass-card">
  <h2 class="form-title text-center">Seller Sign In</h2>

  <!-- Place for showing servlet messages -->
  <div id="message" class="alert text-center d-none"></div>

  <!-- Seller login form -->
  <form action="seller-login" method="post">
    <div class="mb-3">
      <label class="form-label">Email</label>
      <input type="email" name="email" class="form-control" required />
    </div>
    <div class="mb-3">
      <label class="form-label">Password</label>
      <input type="password" name="password" class="form-control" required />
    </div>
    <div class="mb-3 text-end">
      <a href="/seller-reset-password" class="text-white">Forgot password?</a>
    </div>
    <button type="submit" class="btn btn-primary w-100">Sign In</button>
  </form>

  <div class="mt-3 text-center">
    <span>Don't have a seller account?</span>
    <a href="register-seller.html" class="btn btn-outline-light btn-sm ms-2">Register</a>
  </div>

  <div class="mt-2 text-center">
    <span>Want to sign in as a user?</span>
    <a href="sign-in.html" class="btn btn-outline-light btn-sm ms-2">User Login</a>
  </div>
</div>

<script>
  // Read query params from redirect (?error=... or ?success=...)
  const params = new URLSearchParams(window.location.search);
  const error = params.get("error");
  const success = params.get("success");

  if (error || success) {
    const msgBox = document.getElementById("message");
    msgBox.classList.remove("d-none");

    if (error) {
      msgBox.innerText = error;
      msgBox.classList.add("alert-danger");
    } else {
      msgBox.innerText = success;
      msgBox.classList.add("alert-success");
    }
  }
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
