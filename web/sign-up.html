<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>User Sign Up</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    body {
      background: linear-gradient(135deg, #4facfe, #00f2fe);
      background-attachment: fixed;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 2rem;
      font-family: 'Segoe UI', sans-serif;
    }
    .glass-card {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(20px);
      border-radius: 20px;
      padding: 2rem;
      width: 100%;
      max-width: 600px;
      box-shadow: 0 8px 32px rgba(31, 38, 135, 0.37);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.18);
    }
    .form-label, .form-control::placeholder, .form-title, .btn {
      color: #fff;
    }
    .form-control {
      background-color: rgba(255, 255, 255, 0.15);
      border: none;
    }
  </style>
</head>
<body>

<div class="glass-card">
  <h2 class="form-title text-center">User Sign Up</h2>
  <form onsubmit="event.preventDefault(); signUp();">
    <div class="row">
      <div class="col-md-6 mb-3">
        <label class="form-label">First Name</label>
        <input type="text" id="firstName" class="form-control" required />
      </div>
      <div class="col-md-6 mb-3">
        <label class="form-label">Last Name</label>
        <input type="text" id="lastName" class="form-control" required />
      </div>
    </div>
    <div class="mb-3">
      <label class="form-label">Email</label>
      <input type="email" id="email" class="form-control" required />
    </div>
    <div class="mb-3">
      <label class="form-label">Mobile Number</label>
      <input type="text" id="mobile" class="form-control" required />
    </div>
    <div class="mb-3">
      <label class="form-label">Password</label>
      <input type="password" id="password" class="form-control" required />
    </div>
    <div class="mb-3 text-center">
      <span id="message"></span>
    </div>
    <button type="submit" class="btn btn-primary w-100">Sign Up</button>
  </form>
  <div class="mt-3 text-center">
    <span>Already a member?</span>
    <a href="sign-in.html" class="btn btn-outline-light btn-sm ms-2">Sign In</a>
  </div>
</div>

</html>
