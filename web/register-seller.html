<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Create seller store profile">
  <title>Create Store</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(135deg, #4facfe, #00f2fe);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Segoe UI', sans-serif;
    }
    .glass-card {
      background: rgba(255,255,255,0.1);
      backdrop-filter: blur(20px);
      border-radius: 20px;
      padding: 2rem;
      width: 100%;
      max-width: 700px;
      box-shadow: 0 8px 32px rgba(31,38,135,0.37);
      color: #fff;
      border: 1px solid rgba(255,255,255,0.18);
    }
    .form-label, .form-control::placeholder, .form-title, .btn { color: #fff; }
    .form-control { background-color: rgba(255,255,255,0.15); border: none; color: #fff; }
    .form-control::placeholder { color: rgba(255,255,255,0.7); }
    .form-control:focus { background-color: rgba(255,255,255,0.2); border-color: rgba(255,255,255,0.5); color:#fff; }
    .btn-info { background-color: rgba(23,162,184,0.8); border-color: rgba(23,162,184,0.8); }
    .btn-info:hover { background-color: rgba(23,162,184,1); border-color: rgba(23,162,184,1); }
  </style>
</head>
<body>
<div class="glass-card">
  <h2 class="form-title text-center mb-4">Create Store</h2>

  <form id="storeForm" action="SellerRegistration" method="POST">
    <div class="mb-3">
      <label class="form-label">Store Name *</label>
      <input type="text" name="store_name" class="form-control" placeholder="Enter your store name" required />
    </div>
    <div class="mb-3">
      <label class="form-label">Store Email *</label>
      <input type="email" name="store_email" class="form-control" placeholder="store@example.com" required />
    </div>
    <div class="mb-3">
      <label class="form-label">Tax ID</label>
      <input type="text" name="tax_id" class="form-control" placeholder="Business tax ID" />
    </div>
    <div class="mb-4">
      <label class="form-label">Store Description</label>
      <textarea name="store_description" class="form-control" rows="3" placeholder="Describe your store..."></textarea>
    </div>
    <button type="submit" class="btn btn-info w-100">Create Store</button>
  </form>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
