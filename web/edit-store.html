<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Edit seller store profile">
  <meta name="author" content="Your Company Name">
  <title>Edit Store</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(135deg, #4facfe, #00f2fe);
      background-attachment: fixed;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 2rem;
      font-family: 'Segoe UI', sans-serif;
    }
    .glass-card {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 20px;
      padding: 2rem;
      width: 100%;
      max-width: 700px;
      box-shadow: 0 8px 32px rgba(31, 38, 135, 0.37);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.18);
    }
    .form-label, .form-control::placeholder, .form-title, .btn {
      color: #fff;
    }
    .form-control {
      background-color: rgba(255, 255, 255, 0.15);
      border: none;
    }
    .store-card img {
      width: 80px;
      height: 80px;
      object-fit: cover;
      border-radius: 12px;
    }
  </style>
</head>
<body>

<div class="glass-card">
  <h2 class="form-title text-center">UpdateStore</h2>
  <div class="d-flex align-items-center gap-3 mb-3">
<!--    <img src="/images/store-placeholder.png" alt="Store Picture" />-->
    <div>
      <h5>My Online Store</h5>
<!--      <button class="btn btn-outline-light btn-sm"> Store Picture</button>-->
    </div>
  </div>
  <form action="/store/edit" method="POST">
    <div class="mb-3">
      <label class="form-label">Store Name</label>
      <input type="text" name="store_name" class="form-control" required />
    </div>
    <div class="mb-3">
      <label class="form-label">Store Email</label>
      <input type="email" name="store_email" class="form-control" required />
    </div>
    <div class="mb-3">
      <label class="form-label">Mobile</label>
      <input type="text" name="store_mobile" class="form-control" />
    </div>
    <div class="row">
      <div class="col-md-6 mb-3">
        <label class="form-label">Address Line 1</label>
        <input type="text" name="line_1" class="form-control" />
      </div>
      <div class="col-md-6 mb-3">
        <label class="form-label">Address Line 2</label>
        <input type="text" name="line_2" class="form-control" />
      </div>
    </div>
      <div class="row">
      <div class="col-md-6 mb-3">
        <label class="form-label">Postal code</label>
        <input type="text" name="line_1" class="form-control" />
      </div>
      <div class="col-md-6 mb-3">
        <label class="form-label">Tax Id</label>
        <input type="text" name="line_2" class="form-control" />
      </div>
    </div>
      
    <div class="mb-3">
      <label class="form-label">Store description</label>
      <input type="text" name="postal_code" class="form-control" />
    </div>
    <button type="submit" class="btn btn-info w-100">Update Store</button>
  </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
  document.getElementById("storeForm").addEventListener("submit", function(event) {
    event.preventDefault(); // Stop the form from submitting
    window.location.href = "admin.html"; // Redirect to admin.html
  });
</script>
</body>
</html>
