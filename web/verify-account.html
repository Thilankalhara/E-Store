<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Email Verification</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    body {
      background: linear-gradient(135deg, #4facfe, #00f2fe);
      background-attachment: fixed;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 2rem;
      font-family: 'Segoe UI', sans-serif;
    }
    .glass-card {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 20px;
      padding: 2rem;
      width: 100%;
      max-width: 500px;
      box-shadow: 0 8px 32px rgba(31, 38, 135, 0.37);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.18);
    }
    .form-label, .form-control::placeholder, .form-title {
      color: #fff;
    }
    .form-control {
      background-color: rgba(255, 255, 255, 0.15);
      border: none;
    }

    /* Gradient button style */
    .btn-gradient {
      background: linear-gradient(45deg, #00f2fe, #4facfe);
      color: #fff;
      border: none;
      border-radius: 30px;
      padding: 0.5rem 2rem;
      font-weight: 600;
      text-decoration: none;
      display: inline-block;
      transition: background 0.3s ease, transform 0.2s ease;
    }
    .btn-gradient:hover {
      background: linear-gradient(45deg, #4facfe, #00f2fe);
      color: #fff;
      transform: scale(1.05);
      text-decoration: none;
    }
    .btn-gradient:focus {
      outline: none;
      box-shadow: 0 0 8px 2px rgba(0, 242, 254, 0.7);
    }
  </style>
</head>
<body>

  <div class="glass-card">
    <h2 class="form-title text-center mb-4">Verify Your Email</h2>
    <form action="/verify" method="POST">
      <div class="mb-3">
        <label class="form-label" for="verification_code">Verification Code</label>
        <input type="text" id="verification_code" name="verification_code" class="form-control" required placeholder="Enter your code" />
      </div>
      <!-- Link styled as button -->
      <a href="index.html" class="btn-gradient" role="button">Verify</a>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/verify-account.js"></script>
</body>
</html>
