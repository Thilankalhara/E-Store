<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Orders</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>
  <style>
    body {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      padding: 2rem 0;
    }
    .order-container { max-width: 800px; margin: 0 auto; }
    .home-btn {
      position: absolute; top: 20px; left: 20px;
      background: rgba(255, 255, 255, 0.2); backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.3); border-radius: 50px;
      padding: 12px 20px; color: white; text-decoration: none; font-weight: 600;
      transition: all 0.3s ease; display: flex; align-items: center; gap: 8px;
    }
    .home-btn:hover { background: rgba(255, 255, 255, 0.3); transform: translateY(-2px); color: white; }
    .order-card {
      background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(15px);
      border-radius: 20px; box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2); overflow: hidden; margin-bottom: 2rem;
      transition: transform 0.3s ease;
    }
    .order-card:hover { transform: translateY(-5px); }
    .order-header { background: linear-gradient(135deg, #667eea, #764ba2); color: white;
      padding: 1.5rem 2rem; display: flex; justify-content: space-between; align-items: center;
    }
    .order-body { padding: 2rem; }
    .status-section { text-align: center; margin-bottom: 2rem; }
    .status-icon {
      width: 100px; height: 100px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 1rem; font-size: 3rem;
    }
    .status-accepted { background: linear-gradient(45deg, #28a745, #20c997); color: white; }
    .status-pending { background: linear-gradient(45deg, #ffc107, #fd7e14); color: white; animation: pulse 2s infinite; }
    .status-shipped { background: linear-gradient(45deg, #17a2b8, #0dcaf0); color: white; }
    .status-delivered { background: linear-gradient(45deg, #007bff, #0056b3); color: white; }
    .status-cancelled { background: linear-gradient(45deg, #dc3545, #ff6b6b); color: white; }
    @keyframes pulse { 0%{transform:scale(1);}50%{transform:scale(1.05);}100%{transform:scale(1);} }
    .status-title { font-size: 1.5rem; font-weight: 700; margin-bottom: 0.5rem; }
    .status-message { color: #6c757d; font-size: 1rem; }
    .order-details { background: rgba(248, 249, 250, 0.8); border-radius: 15px; padding: 1.5rem; margin-top: 2rem; }
    .detail-item { display: flex; justify-content: space-between; align-items: center;
      padding: 0.75rem 0; border-bottom: 1px solid rgba(0, 0, 0, 0.1); }
    .detail-item:last-child { border-bottom: none; }
    .detail-label { font-weight: 600; color: #495057; display: flex; align-items: center; gap: 8px; }
    .detail-value { color: #6c757d; font-weight: 500; }
  </style>
</head>
<body>
  <a href="index.html" class="home-btn"><i class="fas fa-home"></i>Home</a>
  <div class="container order-container" id="ordersContainer">
    <!-- Orders will be loaded here -->
  </div>

  <script>
    function statusClass(value) {
      switch(value) {
        case 'Pending': return 'status-pending';
        case 'Processing': return 'status-pending';
        case 'Shipped': return 'status-shipped';
        case 'Delivered': return 'status-delivered';
        case 'Cancelled': return 'status-cancelled';
        default: return 'status-accepted';
      }
    }

    function loadOrders() {
      fetch('UserOrders')
        .then(res => res.json())
        .then(data => {
          const container = document.getElementById('ordersContainer');
          container.innerHTML = '';
          if (Array.isArray(data) && data.length) {
            data.forEach(o => {
              const card = document.createElement('div');
              card.className = 'order-card';
              card.innerHTML = `
                <div class="order-header">
                  <div>
                    <h5 class="mb-0"><i class="fas fa-receipt me-2"></i>Order #${o.order_id}</h5>
                    <small class="opacity-75">${o.created_at}</small>
                  </div>
                  <div class="text-end">
                    <h6 class="mb-0">$${Number(o.total_price).toFixed(2)}</h6>
                  </div>
                </div>
                <div class="order-body">
                  <div class="status-section ${statusClass(o.status)}">
                    <div class="status-icon ${statusClass(o.status)}">
                      <i class="fas fa-${o.status==='Delivered'?'check':o.status==='Cancelled'?'times':'clock'}"></i>
                    </div>
                    <div class="status-title">${o.status}</div>
                    <div class="status-message">Your order is currently <b>${o.status}</b></div>
                  </div>
                  <div class="order-details">
                    <div class="detail-item">
                      <div class="detail-label"><i class="fas fa-box"></i> Product</div>
                      <div class="detail-value">${o.product_name}</div>
                    </div>
                    <div class="detail-item">
                      <div class="detail-label"><i class="fas fa-image"></i> Image</div>
                      <div class="detail-value"><img src="${o.product_image}" style="width:50px;height:50px;border-radius:5px;object-fit:cover;"></div>
                    </div>
                    <div class="detail-item">
                      <div class="detail-label"><i class="fas fa-dollar-sign"></i> Price</div>
                      <div class="detail-value">$${Number(o.price).toFixed(2)}</div>
                    </div>
                    <div class="detail-item">
                      <div class="detail-label"><i class="fas fa-sort-numeric-up"></i> Quantity</div>
                      <div class="detail-value">${o.product_qty}</div>
                    </div>
                  </div>
                </div>
              `;
              container.appendChild(card);
            });
          } else {
            container.innerHTML = '<div class="text-center text-white">No orders found</div>';
          }
        })
        .catch(err => {
          console.error(err);
          document.getElementById('ordersContainer').innerHTML = '<div class="text-center text-white">Error loading orders</div>';
        });
    }

    loadOrders();
  </script>
</body>
</html>
