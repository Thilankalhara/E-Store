<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Profile</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-8">
        <div class="card shadow-lg rounded-4">
          <div class="card-body p-4">
            <h3 class="card-title mb-4 text-center">Edit Profile</h3>
            
            <form id="editForm">
              
              <!-- Personal Information Section -->
              <div class="mb-4">
                <h5 class="text-primary mb-3">Personal Information</h5>
                <div class="row">
                  <div class="col-md-6 mb-3">
                    <label for="first_name" class="form-label">First Name <span class="text-danger">*</span></label>
                    <input type="text" class="form-control rounded-3" id="first_name" required>
                  </div>
                  <div class="col-md-6 mb-3">
                    <label for="last_name" class="form-label">Last Name <span class="text-danger">*</span></label>
                    <input type="text" class="form-control rounded-3" id="last_name" required>
                  </div>
                </div>
                <div class="mb-3">
                  <label for="email" class="form-label">Email <span class="text-danger">*</span></label>
                  <input type="email" class="form-control rounded-3" id="email" required>
                </div>
                <div class="mb-3">
                  <label for="mobile" class="form-label">Mobile</label>
                  <input type="text" class="form-control rounded-3" id="mobile" readonly>
                  <small class="text-muted">Mobile number cannot be changed</small>
                </div>
              </div>

              <!-- Address Information Section -->
              <div class="mb-4">
                <h5 class="text-primary mb-3">Address Information</h5>
                <div class="mb-3">
                  <label for="line_1" class="form-label">Address Line 1 <span class="text-danger">*</span></label>
                  <input type="text" class="form-control rounded-3" id="line_1" 
                         placeholder="Street address, P.O. box, company name, c/o" required>
                </div>
                <div class="mb-3">
                  <label for="line_2" class="form-label">Address Line 2 <span class="text-danger">*</span></label>
                  <input type="text" class="form-control rounded-3" id="line_2" 
                         placeholder="Apartment, suite, unit, building, floor, etc." required>
                </div>
                <div class="row">
                  <div class="col-md-6 mb-3">
                    <label for="postal_code" class="form-label">Postal Code <span class="text-danger">*</span></label>
                    <input type="text" class="form-control rounded-3" id="postal_code" maxlength="10" required>
                  </div>
                </div>
              </div>

              <button type="submit" class="btn btn-primary w-100 rounded-3 mb-3">Save Changes</button>
            </form>
            <button id="logoutBtn" class="btn btn-outline-danger w-100 rounded-3">Logout</button>
            <div id="alertBox" class="alert mt-3 d-none"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

<script>
  // Load current user and address data
  document.addEventListener("DOMContentLoaded", () => {
    fetch("edit-profile")
      .then(response => {
        if (response.status === 401) {
          window.location.href = "sign-in.html";
          return null;
        }
        return response.json();
      })
      .then(data => {
        if (!data) return;
        
        // Check for redirect instruction
        if (data.redirect) {
          window.location.href = data.redirect;
          return;
        }
        
        // Populate user fields
        document.getElementById("first_name").value = data.first_name || "";
        document.getElementById("last_name").value = data.last_name || "";
        document.getElementById("email").value = data.email || "";
        document.getElementById("mobile").value = data.mobile || "";
        
        // Populate address fields
        document.getElementById("line_1").value = data.line_1 || "";
        document.getElementById("line_2").value = data.line_2 || "";
        document.getElementById("postal_code").value = data.postal_code || "";
        
        console.log("Profile loaded successfully");
      })
      .catch(err => {
        console.error("Error loading profile:", err);
        showAlert("Error loading profile data", "danger");
        
        // Redirect to sign-in on error
        setTimeout(() => {
          window.location.href = "sign-in.html";
        }, 3000);
      });
  });

  // Save changes
  document.getElementById("editForm").addEventListener("submit", e => {
    e.preventDefault();
    
    const body = {
      first_name: document.getElementById("first_name").value.trim(),
      last_name: document.getElementById("last_name").value.trim(),
      email: document.getElementById("email").value.trim(),
      line_1: document.getElementById("line_1").value.trim(),
      line_2: document.getElementById("line_2").value.trim(),
      postal_code: document.getElementById("postal_code").value.trim()
    };

    // Basic validation
    if (!body.first_name || !body.last_name || !body.email) {
      showAlert("Please fill in all required fields", "danger");
      return;
    }

    // Email validation
    const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    if (!emailRegex.test(body.email)) {
      showAlert("Please enter a valid email address", "danger");
      return;
    }

    // Address validation
    if (!body.line_1 || !body.line_2 || !body.postal_code) {
      showAlert("Please fill in all address fields", "danger");
      return;
    }

    // Show loading state
    const submitBtn = document.querySelector('button[type="submit"]');
    const originalText = submitBtn.textContent;
    submitBtn.textContent = "Saving...";
    submitBtn.disabled = true;

    fetch("edit-profile", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify(body)
    })
      .then(response => {
        // Handle authentication errors
        if (response.status === 401) {
          showAlert("Session expired. Please log in again.", "danger");
          setTimeout(() => {
            window.location.href = "sign-in.html";
          }, 2000);
          return null;
        }
        
        return response.json();
      })
      .then(data => {
        if (!data) return;
        
        // Check for redirect instruction
        if (data.redirect) {
          window.location.href = data.redirect;
          return;
        }
        
        showAlert(data.message, data.status ? "success" : "danger");
        
        if (data.status) {
          // Reload data after successful save
          setTimeout(() => {
            window.location.reload();
          }, 1500);
        }
      })
      .catch(err => {
        console.error("Error saving profile:", err);
        showAlert("Error saving profile. Please try again.", "danger");
      })
      .finally(() => {
        // Restore button state
        submitBtn.textContent = originalText;
        submitBtn.disabled = false;
      });
  });

  // Logout
  document.getElementById("logoutBtn").addEventListener("click", () => {
    if (confirm("Are you sure you want to logout?")) {
      fetch("SignOut")
        .then(r => r.json())
        .then(data => {
          if (data.status) {
            window.location.href = "sign-in.html";
          } else {
            showAlert("Logout failed", "danger");
          }
        })
        .catch(err => {
          console.error("Logout error:", err);
          showAlert("Logout failed", "danger");
        });
    }
  });

  function showAlert(msg, type) {
    const alertBox = document.getElementById("alertBox");
    alertBox.className = "alert alert-" + type;
    alertBox.textContent = msg;
    alertBox.classList.remove("d-none");
    setTimeout(() => alertBox.classList.add("d-none"), 5000);
  }
</script>

<style>
  .text-danger {
    color: #dc3545 !important;
  }
</style>
</body>
</html>
